name: Package checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: filter, gettext, openssl, ctype, mbstring
          coverage: none
      - run: php tests/run.php
      - run: php tests/ha.php
      - run: php tests/carp.php
      - run: python3 tests/supervisor.py
      - run: python3 tests/check.py
      - run: node --check files/usr/local/www/frp-assets/frp.js
      - run: git diff --check
      - run: sh tests/release.sh
